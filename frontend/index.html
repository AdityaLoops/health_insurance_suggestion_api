<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Health Insurance Price Estimator</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header> <h1>Health Insurance Price Estimator</h1></header>
    <p>Estimate your health insurance charges using machine learning</p>
    
    <main>
        <section class="form-card">
            <h2>Your Details</h2>
 
            <form id="insurance-form">
                <label for="age">Age</label>
                <input
                type="number"
                id="age"
                name="age"
                placeholder="18"
                required
                >
                
                <label for="sex">Sex</label>
                <select id="sex" name="sex" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
 
                <label for="bmi">BMI</label>
                <input
                type="number"
                id="bmi"
                name="bmi"
                step="0.1"
                placeholder="15.2"
                required
                >
                 
                
                <label for="children">Number Of Children</label>
                <input type="number" id="children" name="children" min="0" placeholder="2" required> 
                 

                 <label for="smoker">Do You Smoke?</label>
                 <select id="smoker" name="smoker" required>
                    <option value="yes"> Yes</option>
                    <option value="no">No</option>
                 </select>
                  

                  <label for="region"> Region </label>
                  <select id="region" name="region" required>
                    <option value="southwest">Southwest</option>
                    <option value="southeast">Southeast</option>
                    <option value="northwest">Northwest</option>
                    <option value="northeast">Northeast</option>
                  </select>

                  <button type="submit">Estimate Insurance Cost</button>

            </form>
        </section>
    </main>
</body>

</html>
